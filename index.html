<html lang="en">
<head>

<title>DE-LEX</title>
<style>

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:11px/1.4 "Courier New",Courier,monospace;letter-spacing:.02em}
body{display:grid;grid-template-columns:1fr 300px;overflow:hidden}
.stage{position:relative;min-width:0;min-height:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.reg{position:absolute;width:15px;height:15px;pointer-events:none;background:linear-gradient(#fff,#fff) center/1px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 1px no-repeat;mix-blend-mode:difference}
.reg.a{left:28px;top:28px}.reg.b{right:28px;top:28px}.reg.c{left:28px;bottom:28px}.reg.d{right:28px;bottom:28px}
.toast,#toast{position:absolute;right:28px;bottom:44px;max-width:60%;text-align:right;font-size:11px;pointer-events:none;mix-blend-mode:difference;opacity:0;transition:opacity .2s}
.title small{display:block;font-size:10px;opacity:.7;margin-top:2px;letter-spacing:.04em}
.title{position:absolute;left:28px;bottom:44px;font-size:13px;pointer-events:none;mix-blend-mode:difference}
aside{border-left:1px solid var(--line);padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#thumb{width:100%;height:auto;display:block;border:1px solid var(--line);aspect-ratio:27/8;background:#000}
button,select,textarea,input[type=text]{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--fg);border-radius:0;padding:7px;cursor:pointer;letter-spacing:inherit}
select option{background:#000}
button:hover{background:var(--fg);color:#000}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[aria-pressed=true]{background:var(--fg);color:#000}
.row{display:flex;gap:6px}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lab{display:block;margin-bottom:2px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg)}
input[type=range]::-moz-range-track{height:1px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--fg);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg);border:0}
#hue::-webkit-slider-runnable-track{height:5px;background:linear-gradient(90deg,#fff 0,#f33 6%,#ff3 22%,#3f3 38%,#3ff 55%,#33f 72%,#f3f 88%,#f33)}
#hue::-moz-range-track{height:5px;background:linear-gradient(90deg,#fff 0,#f33 6%,#ff3 22%,#3f3 38%,#3ff 55%,#33f 72%,#f3f 88%,#f33)}
#hue::-webkit-slider-thumb{margin-top:-3px}
.lay button{padding:6px;display:grid;place-items:center}
.lay svg{width:18px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
textarea,input[type=text]{text-align:center;font-size:14px;cursor:text;width:100%;resize:none}
.note{color:var(--dim);margin:0}
.fn{display:grid;grid-template-columns:34px 1fr 34px;gap:6px}
.fn select{min-width:0}
#file{display:none}
@media (max-width:760px){
 body{grid-template-columns:1fr;grid-template-rows:56% 1fr}
 aside{border-left:0;border-top:1px solid var(--line)}
 .reg.a,.reg.b{top:16px}.reg.c,.reg.d{bottom:16px}.reg.a,.reg.c{left:16px}.reg.b,.reg.d{right:16px}
 .title{left:16px;bottom:34px}
}
</style>
</head>

// ---- Camera interaction (motion / hand-colour tracking, no external models) ----
const CAM={on:false,v:null,st:null,s:null,sx:null,p:null,c:null,miss:0,f:new Float32Array(3072)};
async function camStart(){

$('#camm').onchange=e=>{P.camm=e.target.value;CAM.f.fill(0);CAM.p=null;CAM.c=null};

function camStep(){

 if(!CAM.p)CAM.p=new Float32Array(3072);
 let sw=0,mx=0,my=0;
 for(let i=0,j=0;i<3072;i++,j+=4){
  const r=d[j],g=d[j+1],b=d[j+2],y=.299*r+.587*g+.114*b;let m;
  if(skin){const cb=128-.1687*r-.3313*g+.5*b,cr=128+.5*r-.4187*g-.0813*b;m=(cr>135&&cr<175&&cb>85&&cb<128&&r>60)?1:0;f[i]=f[i]*.6+m*.4}
  else{const dd=Math.abs(y-CAM.p[i]);m=dd>16?Math.min(1,dd/50):0;f[i]=Math.max(f[i]*.84,m)}

 }
 if(sw>(skin?12:3)){const nx=mx/sw/64,ny=my/sw/48;CAM.c=CAM.c?{x:CAM.c.x+(nx-CAM.c.x)*.4,y:CAM.c.y+(ny-CAM.c.y)*.4}:{x:nx,y:ny};CAM.miss=0}else if(++CAM.miss>8)CAM.c=null;
 const pv=$('#campv').getContext('2d');pv.drawImage(CAM.s,0,0,160,120);pv.fillStyle='rgba(255,255,255,.55)';
 for(let i=0;i<3072;i++)if(f[i]>.25){pv.fillRect((i%64)*2.5,((i/64)|0)*2.5,2.5,2.5)}

function camF(u,v){

 return(f[y0*64+x0]*(1-a)+f[y0*64+x1]*a)*(1-b)+(f[y1*64+x0]*(1-a)+f[y1*64+x1]*a)*b;

function draw(t,X,o){X=X||ctx;o=o||{};
 const W=o.W||cv.clientWidth,Hh=o.H||cv.clientHeight;if(!W||!Hh)return;
 const S=W/1500,H=P.size*4.6*S,css=FONTS[P.fi].css,cp=capOf(css),k=H/cp,R=P.radius*.28*S*P.size/60,tt=t*P.speed/50;
 X.setTransform(dpr,0,0,dpr,0,0);X.globalCompositeOperation='source-over';

 const iB=useB?place([...caseT(P.textB)],k,H,extra,mw,W,S):null;

 let fx=0,fy=0,fs=1;
 if(P.fit&&iA.length){let a=1e9,b=-1e9,c=1e9,d=-1e9;iA.forEach(it=>{const hw=it.g.adv*SX()*k/2+R;a=Math.min(a,it.x-hw);b=Math.max(b,it.x+hw);c=Math.min(c,it.y-H*.5*(it.g.hh||1)-R);d=Math.max(d,it.y+H*.5*(it.g.hh||1)+R)});fs=Math.min(1,W*.9/(b-a),Hh*.88/(d-c));fx=(a+b)/2;fy=(c+d)/2}

 const tot=o.rec?Math.max(4,Math.min(9000,o.maxShapes/ucost)):(P.evolve||CAM.on?2600:9000);

 const cr=[],cs=[],cd=[];for(let i=0;i<N;i++){jx.push((rnd()-.5)*2*js);jy.push((rnd()-.5)*2*js);cr.push(rnd());cs.push(rnd());cd.push(rnd())}

 const pm=P.evolve&&P.pulse?1-P.pulse/100*(.5-.5*Math.cos(tt*1.1)):1;

  X.save();X.rotate(s*T/sy);if(q)X.scale(-1,1);
  for(let c=0;c<P.copies;c++){
   const sc=Math.max(.05,1+c*P.offScale/100),wob=P.evolve?Math.sin(tt*.7+c)*10*S:0;
   const mx=Math.min(1,P.morph/100+(P.copies>1?P.sweep/100*c/(P.copies-1):0));
   X.save();X.translate(c*P.offX*S+wob,c*P.offY*S);X.rotate(c*P.rot*Math.PI/180);X.scale(sc,sc);
   for(let i=0;i<N;i++){
    const a=A[(i*A.length/N)|0],wv=a[2];let x=a[0],y=a[1];
    if(useB){const b=B[(i*B.length/N)|0];x+=(b[0]-x)*mx;y+=(b[1]-y)*mx}
    x+=jx[i];y+=jy[i];
    if(P.twist){const g=P.twist/100*Math.hypot(x,y)/(H*.6),cs=Math.cos(g),sn=Math.sin(g);const nx=x*cs-y*sn;y=x*sn+y*cs;x=nx}
    if(wq){x+=Math.sin(y/(H*.3)+tt)*wq;y+=Math.cos(x/(H*.3)+tt*.8)*wq;
     if(ptr){const dx=ptr.x-x,dy=ptr.y-y,f=Math.exp(-(dx*dx+dy*dy)/(H*H*.5))*P.warp/100*.8;x+=dx*f;y+=dy*f}}
    let cm=1;
    if(cam){const fv=camF(((x-fx)*fs+W/2)/W,((y-fy)*fs+Hh/2)/Hh),fx2=P.camfx;
     if(fx2<2&&cc){const dx=cc.x-x,dy=cc.y-y,g=Math.exp(-(dx*dx+dy*dy)/(H*H*.8))*ck*.9*(fx2?-1.2:1);x+=dx*g;y+=dy*g}
     else if(fx2===2)cm=1+fv*ck*3;
     else if(fx2===3)cm=Math.max(.05,1-fv*ck);
     else if(fx2===4&&cc){const a=fv*ck*3,cs2=Math.cos(a),sn=Math.sin(a),dx=x-cc.x,dy=y-cc.y;x=cc.x+dx*cs2-dy*sn;y=cc.y+dx*sn+dy*cs2}
     else if(fx2===5){x+=(cr[i]-.5)*fv*ck*H*1.2;y+=(cs[i]-.5)*fv*ck*H*1.2}}

    X.save();X.translate(x,y);if(ch)X.rotate((cr[i]-.5)*T*ch);unit(X,r,i,tt);X.restore();

   X.restore();
  }

 }
 X.restore();X.globalCompositeOperation='source-over';
 if(o.rec)return;const tw=th.width,thh=th.height,sw=cv.width*.22,sh=sw*thh/tw;
 tx.drawImage(cv,cv.width/2-sw/2,cv.height/2-sh/2,sw,sh,0,0,tw,thh);
}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);dirty=true}
new ResizeObserver(resize).observe(cv);
(function tick(ms){if(CAM.on)camStep();if(!recBusy&&(P.evolve||dirty||CAM.on)){dirty=false;draw(ms/1000)}requestAnimationFrame(tick)})(0);
